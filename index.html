</head>

<div class="container">

      <button class="choice-btn btn-dare" onclick="drawCard('dare')">Θάρρος</button>

    <div class="action-buttons" id="action-buttons" style="display: none;">

      <button class="btn-action btn-next" onclick="nextTurn()">Επόμενος Γύρος →</button>

  "Κάθισε απέναντί μου και άνοιξε τα κουμπιά της μπλούζας σου μέχρι τη μέση.",
  "Δώσε μου ένα φιλί στο σημείο που ενώνεται ο λαιμός με τον ώμο.",
  "Άσε με να σου περάσω ένα δάχτυλο αργά κατά μήκος του κάτω χείλους σου.",
  "Βγάλε ένα ρούχο σου και πέτα το πάνω μου.",
  "Φίλησέ με στην κοιλιά ακριβώς κάτω από το στομάχι.",
  "Άσε με να σου κρατήσω το κεφάλι με τα δύο μου χέρια και να σε φιλήσω βαθιά.",
  "Κάνε μου μια εξομολόγηση για το τι σκέφτηκες την πρώτη φορά που με είδες γυμνό/ή.",
  "Βάλε τα χέρια σου κάτω από τους μηρούς μου και σήκωσέ τους ελαφρά.",
  "Φίλησέ με στα δάχτυλα του χεριού ένα προς ένα.",
  "Άσε με να σου δαγκώσω απαλά το σαγόνι.",
  "Κάθισε μπρούμυτα και άσε με να σου κάνω μασάζ στη μέση με αργές κινήσεις.",
  "Δώσε μου ένα φιλί διάρκειας 20 δευτερολέπτων χωρίς να χρησιμοποιήσεις καθόλου γλώσσα.",
  "Άσε με να σου χαϊδέψω το εσωτερικό του μπράτσου με τα ακροδάχτυλά μου.",
  "Βγάλε ένα ρούχο μου που επιλέγεις εσύ.",
  "Φίλησέ με στο στήθος ακριβώς πάνω από το ρούχο με ένταση.",
  "Άσε με να σου ψιθυρίσω στο αυτί ποιο ρούχο σου θέλω να βγάλεις πρώτο.",
  "Κάνε μου ένα αργό χάδι από το γόνατο μέχρι τη μέση πάνω από το παντελόνι.",
  "Βάλε τα χέρια σου στο πίσω μέρος του λαιμού μου και φέρε με κοντά σου.",
  "Φίλησέ με με τόσο πάθος που να μας κοπεί η ανάσα.",
  "Άσε με να σε αγκαλιάσω και να μείνουμε ακίνητοι για 30 δευτερόλεπτα νιώθοντας την επαφή.",
  "Κάνε ό,τι θέλεις εσύ πάνω μου για τα επόμενα 45 δευτερόλεπτα χωρίς να μιλήσεις."
];

// STATE MANAGEMENT
const players = ["Άρης", "Δήμητρα"];
let currentTurn = 0;
let round = 1;
let currentMode = null;
let availableTruths = [];
let availableDares = [];
let drawnCount = 0;

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function startGame() {
  availableTruths = shuffle(truths);
  availableDares = shuffle(dares);
  currentTurn = 0;
  round = 1;
  drawnCount = 0;

  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');

  setupScreen.style.display = 'none';
  gameScreen.style.display = 'flex';
  gameScreen.classList.remove('screen-enter');
  void gameScreen.offsetWidth;
  gameScreen.classList.add('screen-enter');

  updateTurnUI();
}

function goToHome() {
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');

  gameScreen.style.display = 'none';
  setupScreen.style.display = 'block';
  setupScreen.classList.remove('screen-enter');
  void setupScreen.offsetWidth;
  setupScreen.classList.add('screen-enter');
}

function updateTurnUI() {
  const activePlayer = players[currentTurn];
  document.getElementById('turn-badge').innerText = `Σειρά σου, ${activePlayer}!`;
  document.getElementById('stats').innerText = `Γύρος: ${round} | Κάρτες: ${drawnCount}/600`;
  
  // Reset card area
  document.getElementById('card-type').innerText = "Επίλεξε";
  document.getElementById('card-type').style.color = "var(--text-muted)";
  document.getElementById('card-text').innerText = "Διάλεξε αν αντέχεις την Αλήθεια ή προτιμάς το Θάρρος...";
  document.getElementById('card-area').style.borderColor = "rgba(255, 255, 255, 0.1)";
  
  // Show choices, hide actions
  document.getElementById('choice-buttons').style.display = 'flex';
  document.getElementById('action-buttons').style.display = 'none';
}

function drawCard(type) {
  currentMode = type;
  let text = "";

  if (type === 'truth') {
    if (availableTruths.length === 0) availableTruths = shuffle(truths);
    text = availableTruths.pop();
    document.getElementById('card-type').innerText = "Αλήθεια";
    document.getElementById('card-type').style.color = "var(--accent-truth-glow)";
    document.getElementById('card-area').style.borderColor = "var(--accent-truth)";
  } else {
    if (availableDares.length === 0) availableDares = shuffle(dares);
    text = availableDares.pop();
    document.getElementById('card-type').innerText = "Θάρρος";
    document.getElementById('card-type').style.color = "var(--accent-dare-glow)";
    document.getElementById('card-area').style.borderColor = "var(--accent-dare)";
  }

  drawnCount++;

  // Smooth pop animation
  const cardArea = document.getElementById('card-area');
  cardArea.style.transform = "scale(0.95)";
  setTimeout(() => {
    document.getElementById('card-text').innerText = text;
    cardArea.style.transform = "scale(1)";
  }, 120);

  document.getElementById('choice-buttons').style.display = 'none';
  document.getElementById('action-buttons').style.display = 'flex';
  document.getElementById('stats').innerText = `Γύρος: ${round} | Κάρτες: ${drawnCount}/600`;
}

function skipCard() {
  if (currentMode) {
    drawCard(currentMode);
  }
}

function nextTurn() {
  currentTurn = (currentTurn + 1) % 2;
  if (currentTurn === 0) round++;
  currentMode = null;
  updateTurnUI();
}
</script>
