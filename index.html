<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Θάρρος ή Αλήθεια;</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b090d;
      --card-bg: rgba(26, 20, 29, 0.88);
      --accent-truth: #6b21a8;
      --accent-truth-glow: #a855f7;
      --accent-dare: #991b1b;
      --accent-dare-glow: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Montserrat', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    html {
      background-color: var(--bg-dark);
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      background-color: var(--bg-dark);
      background: radial-gradient(circle at top, #1a0b16 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .screen-enter {
      animation: screenFadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #setup-screen {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 46px 24px;
      border-radius: 26px;
      width: 100%;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.7);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ec4899, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 28px;
    }
    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, #e11d48, #9333ea);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(225, 29, 72, 0.45);
      transition: transform 0.15s ease;
    }
    .btn-start:active { transform: scale(0.97); }

    #game-screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .btn-home {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-home:active { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .turn-badge {
      background: rgba(244, 63, 94, 0.12);
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* CARD & TINDER SWIPE STYLES */
    .card-area {
      width: 100%;
      min-height: 290px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(0,0,0,0.7);
      margin-bottom: 22px;
      position: relative;
      touch-action: pan-y;
      will-change: transform, opacity;
      cursor: grab;
      overflow-y: auto;
    }
    .card-area:active { cursor: grabbing; }

    .swipe-badge {
      position: absolute;
      top: 18px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.1s ease;
    }
    .badge-skip {
      right: 20px;
      color: #ef4444;
      border: 2.5px solid #ef4444;
      transform: rotate(14deg);
      background: rgba(239, 68, 68, 0.14);
    }
    .badge-next {
      left: 20px;
      color: #10b981;
      border: 2.5px solid #10b981;
      transform: rotate(-14deg);
      background: rgba(16, 185, 129, 0.14);
    }

    .card-type {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* ΧΡΟΝΟΜΕΤΡΟ */
    .timer-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
    }
    .timer-display {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f43f5e;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }
    .timer-display.ended {
      color: #ef4444;
      text-shadow: 0 0 16px rgba(239, 68, 68, 0.85);
    }
    .timer-status {
      display: none;
      font-size: 14px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @keyframes pulseAlert {
      0% { transform: scale(0.96); opacity: 0.8; }
      50% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.8; }
    }
    .timer-ended-pulse {
      display: block !important;
      animation: pulseAlert 0.7s infinite ease-in-out;
    }
    .timer-controls {
      display: flex;
      gap: 10px;
    }
    .btn-timer {
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.45);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-timer:active {
      transform: scale(0.95);
      background: rgba(244, 63, 94, 0.35);
    }
    .btn-timer-reset {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
    }

    .choice-buttons { display: flex; gap: 14px; width: 100%; margin-bottom: 14px; }
    .choice-btn {
      flex: 1;
      padding: 18px 10px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      transition: transform 0.15s;
    }
    .choice-btn:active { transform: scale(0.96); }
    .btn-truth {
      background: linear-gradient(135deg, #7e22ce, #9333ea);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
    }
    .btn-dare {
      background: linear-gradient(135deg, #b91c1c, #e11d48);
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
    }
    .action-buttons { display: flex; gap: 10px; width: 100%; }
    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-skip {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-skip:active { background: rgba(255, 255, 255, 0.16); color: #fff; }
    .btn-next {
      background: #27272a;
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-next:active { background: #3f3f46; }
    .stats { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-top: 18px; }
  </style>
</head>
<body>

<div class="container">
  <!-- START SCREEN (Χωρίς ονόματα) -->
  <div id="setup-screen" class="screen-enter">
    <h1>Θάρρος ή Αλήθεια;</h1>
    <button class="btn-start" onclick="startGame()">Έναρξη Παιχνιδιού</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <div class="top-bar">
      <button class="btn-home" onclick="goToHome()">← Αρχική</button>
      <div id="turn-badge" class="turn-badge">Σειρά σου, Άρης!</div>
    </div>

    <!-- TINDER CARD -->
    <div id="card-area" class="card-area">
      <div id="badge-next" class="swipe-badge badge-next">Επόμενο ➜</div>
      <div id="badge-skip" class="swipe-badge badge-skip">✖ Skip</div>

      <div id="card-type" class="card-type" style="color: var(--text-muted);">Επίλεξε</div>
      <div id="card-text" class="card-text">Αντέχεις την Αλήθεια ή προτιμάς το Θάρρος;</div>

      <!-- TIMER CONTAINER -->
      <div id="timer-container" class="timer-container">
        <div id="timer-display" class="timer-display">00:30</div>
        <div id="timer-status" class="timer-status">⏰ Τέλος Χρόνου!</div>
        <div class="timer-controls">
          <button id="btn-timer-start" class="btn-timer" onclick="toggleTimer()">Έναρξη</button>
          <button id="btn-timer-reset" class="btn-timer btn-timer-reset" onclick="resetTimer()">Επαναφορά</button>
        </div>
      </div>
    </div>

    <div class="choice-buttons" id="choice-buttons">
      <button class="choice-btn btn-truth" onclick="drawCard('truth')">Αλήθεια</button>
      <button class="choice-btn btn-dare" onclick="drawCard('dare')">Θάρρος</button>
    </div>

    <div class="action-buttons" id="action-buttons" style="display: none;">
      <button class="btn-action btn-skip" onclick="skipCard()">Skip / Άλλη</button>
      <button class="btn-action btn-next" onclick="nextTurn()">Επόμενος Γύρος →</button>
    </div>

    <div class="stats" id="stats">Γύρος: 1</div>
  </div>
</div>

  if (!e.target.closest('.card-area')) {
    e.preventDefault();

// STATE MANAGEMENT
const players = ["Άρης", "Δήμητρα"];
let currentTurn = 0;
let round = 1;
let currentMode = null;
let availableTruths = [];
let availableDares = [];

// TIMER STATE
let timerInterval = null;
let timerInitialSeconds = 0;
let timerRemainingSeconds = 0;

// CACHED DOM ELEMENTS
const dom = {
  setupScreen: document.getElementById('setup-screen'),
  gameScreen: document.getElementById('game-screen'),
  turnBadge: document.getElementById('turn-badge'),

// Fisher-Yates Shuffle
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  availableTruths = shuffle(truths);
  availableDares = shuffle(dares);
  currentTurn = 0;
  round = 1;

  dom.setupScreen.style.display = 'none';
  dom.gameScreen.style.display = 'flex';
  dom.gameScreen.classList.remove('screen-enter');
  void dom.gameScreen.offsetWidth;
  dom.gameScreen.classList.add('screen-enter');

  updateTurnUI();
}

function goToHome() {
  clearInterval(timerInterval);
  timerInterval = null;

  dom.gameScreen.style.display = 'none';
  dom.setupScreen.style.display = 'flex';
  dom.setupScreen.classList.remove('screen-enter');
  void dom.setupScreen.offsetWidth;
  dom.setupScreen.classList.add('screen-enter');
}

function updateTurnUI() {
  clearInterval(timerInterval);
  timerInterval = null;
  dom.timerContainer.style.display = 'none';

  const activePlayer = players[currentTurn];
  dom.turnBadge.innerText = `Σειρά σου, ${activePlayer}!`;
  dom.stats.innerText = `Γύρος: ${round}`;
  
  // Επαναφορά κάρτας

  dom.actionButtons.style.display = 'none';
}

// Αφαίρεση ελληνικών τόνων για αλάνθαστη αναγνώριση
function removeAccents(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function extractSeconds(rawText) {
  if (!rawText) return null;
  const text = removeAccents(rawText);

  if (text.includes("μισο λεπτο") || text.includes("μισου λεπτου")) return 30;
  if (text.includes("ενα λεπτο") || text.includes("ενος λεπτου")) return 60;
  if (text.includes("δυο λεπτα")) return 120;

  // Αναζήτηση δευτερολέπτων (π.χ. 30 δευτερολεπτα, 45 δευτερολεπτων)
  const secMatch = text.match(/(\d+)\s*δευτερολεπτ/);
  if (secMatch) return parseInt(secMatch[1], 10);

  // Αναζήτηση λεπτών (π.χ. 1 λεπτο, 2 λεπτα)
  const minMatch = text.match(/(\d+)\s*λεπτ/);
  if (minMatch) {
    const mins = parseInt(minMatch[1], 10);
    if (mins <= 5) return mins * 60;
  }

  return null;
}

function setupTimerForText(text) {
  clearInterval(timerInterval);
  timerInterval = null;
  
  dom.timerStatus.classList.remove('timer-ended-pulse');
  dom.timerStatus.style.display = 'none';
  dom.timerDisplay.classList.remove('ended');

  const detectedSeconds = extractSeconds(text);
  if (detectedSeconds && detectedSeconds > 0) {
    timerInitialSeconds = detectedSeconds;
    timerRemainingSeconds = detectedSeconds;
    updateTimerDisplay(timerRemainingSeconds);
    dom.btnTimerStart.innerText = 'Έναρξη';
    dom.timerContainer.style.display = 'flex';
  } else {
    dom.timerContainer.style.display = 'none';
  }
}

function updateTimerDisplay(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  dom.timerDisplay.innerText = 
    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function toggleTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    dom.btnTimerStart.innerText = 'Συνέχεια';
    return;
  }

  if (timerRemainingSeconds <= 0) {
    timerRemainingSeconds = timerInitialSeconds;
    dom.timerStatus.classList.remove('timer-ended-pulse');
    dom.timerStatus.style.display = 'none';
    dom.timerDisplay.classList.remove('ended');
  }

  dom.btnTimerStart.innerText = 'Παύση';

  timerInterval = setInterval(() => {
    timerRemainingSeconds--;
    updateTimerDisplay(timerRemainingSeconds);

    if (timerRemainingSeconds <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      dom.btnTimerStart.innerText = 'Έναρξη';
      dom.timerDisplay.classList.add('ended');
      dom.timerStatus.classList.add('timer-ended-pulse');
    }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRemainingSeconds = timerInitialSeconds;
  updateTimerDisplay(timerRemainingSeconds);
  
  dom.timerStatus.classList.remove('timer-ended-pulse');
  dom.timerStatus.style.display = 'none';
  dom.timerDisplay.classList.remove('ended');
  dom.btnTimerStart.innerText = 'Έναρξη';
}

function drawCard(type, animateFromSwipe = false) {
  currentMode = type;
  let text = "";

  if (type === 'truth') {
    if (availableTruths.length === 0) availableTruths = shuffle(truths);
    text = availableTruths.pop();
    dom.cardType.innerText = "Αλήθεια";
    dom.cardType.style.color = "var(--accent-truth-glow)";
    dom.cardArea.style.borderColor = "var(--accent-truth)";
  } else {
    if (availableDares.length === 0) availableDares = shuffle(dares);
    text = availableDares.pop();
    dom.cardType.innerText = "Θάρρος";
    dom.cardType.style.color = "var(--accent-dare-glow)";
    dom.cardArea.style.borderColor = "var(--accent-dare)";
  }

  // Άμεση ανανέωση κειμένου και χρονομέτρου
  dom.cardText.innerText = text;
  setupTimerForText(text);

  if (animateFromSwipe) {
    // Επαναφορά με καθαρό scale-in (δεν φαίνεται ποτέ η παλιά ερώτηση)
    dom.cardArea.style.transition = 'none';
    dom.cardArea.style.transform = 'scale(0.88)';
    dom.cardArea.style.opacity = '0';
    void dom.cardArea.offsetWidth; // Trigger reflow
    dom.cardArea.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease-out';
    dom.cardArea.style.transform = 'scale(1) translate(0px, 0px) rotate(0deg)';
    dom.cardArea.style.opacity = '1';
  } else {
    // Pop animation για πάτημα κουμπιού
    dom.cardArea.style.transition = 'none';
    dom.cardArea.style.transform = 'scale(0.95)';
    void dom.cardArea.offsetWidth;
    dom.cardArea.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    dom.cardArea.style.transform = 'scale(1)';
  }

  dom.choiceButtons.style.display = 'none';
  dom.actionButtons.style.display = 'flex';
  dom.stats.innerText = `Γύρος: ${round}`;
}

function skipCard(fromSwipe = false) {
  clearInterval(timerInterval);
  timerInterval = null;
  if (currentMode) {
    drawCard(currentMode, fromSwipe);
  }
}

function nextTurn() {
  clearInterval(timerInterval);
  timerInterval = null;
  currentTurn = (currentTurn + 1) % 2;
  if (currentTurn === 0) round++;
  currentMode = null;
  updateTurnUI();
}

function resetCardInstant() {
  dom.cardArea.style.transition = 'none';
  dom.cardArea.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
  dom.cardArea.style.opacity = '1';
  dom.badgeSkip.style.opacity = '0';
  dom.badgeNext.style.opacity = '0';
}

/* TINDER SWIPE SYSTEM */
(function setupSwipe() {
  const card = dom.cardArea;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let currentY = 0;
  let isHorizontalGesture = null;

  function onStart(x, y, target) {
    if (!currentMode) return;
    if (target.closest('.timer-controls') || target.closest('button')) return;
    isDragging = true;
    startX = x;
    startY = y;
    currentX = x;
    currentY = y;
    isHorizontalGesture = null;
    card.style.transition = 'none';
  }

  function onMove(x, y) {
    if (!isDragging || !currentMode) return;
    currentX = x;
    currentY = y;
    const diffX = currentX - startX;
    const diffY = currentY - startY;

    if (isHorizontalGesture === null) {
      if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
        isHorizontalGesture = Math.abs(diffX) > Math.abs(diffY);
      }
    }

    if (!isHorizontalGesture) return;

    const rotate = diffX * 0.08;
    card.style.transform = `translate(${diffX}px, ${diffY * 0.12}px) rotate(${rotate}deg)`;

    const progress = Math.min(Math.abs(diffX) / 95, 1);
    if (diffX < 0) {
      dom.badgeSkip.style.opacity = progress;
      dom.badgeNext.style.opacity = 0;
    } else {
      dom.badgeNext.style.opacity = progress;
      dom.badgeSkip.style.opacity = 0;
    }
  }

  function onEnd() {
    if (!isDragging || !currentMode) return;
    isDragging = false;

    if (!isHorizontalGesture) {
      resetCardInstant();
      return;
    }

    const diffX = currentX - startX;
    const threshold = 90;

    dom.badgeSkip.style.opacity = 0;
    dom.badgeNext.style.opacity = 0;

    if (diffX < -threshold) {
      // SWIPE LEFT -> SKIP
      card.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
      card.style.transform = 'translate(-130vw, 0px) rotate(-26deg)';
      card.style.opacity = '0';
      setTimeout(() => {
        skipCard(true);
      }, 160);
    } else if (diffX > threshold) {
      // SWIPE RIGHT -> NEXT TURN
      card.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
      card.style.transform = 'translate(130vw, 0px) rotate(26deg)';
      card.style.opacity = '0';
      setTimeout(() => {
        nextTurn();
      }, 160);
    } else {
      // SNAP BACK
      card.style.transition = 'transform 0.22s ease-out, opacity 0.22s ease-out';
      card.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
      card.style.opacity = '1';
    }
  }

  card.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
  card.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  card.addEventListener('touchend', onEnd);
  card.addEventListener('touchcancel', onEnd);

  card.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
})();

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW Active:', reg.scope))
      .catch(err => console.error('SW Error:', err));
  });
}
